name: iacp-controlplane-prod

x-runtime-environment: &runtime-environment
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: ${POSTGRES_DB:-iacp_controlplane}
  PGUSER: ${POSTGRES_USER:-iacp}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en Portainer}
  IACP_TERRAFORM_PATH: /app/terraform
  IACP_TERRAFORM_MNG_DIR: environments/mng01
  IACP_MNG_CATALOG: /app/terraform/environments/mng01/catalog.json
  IACP_WORKDATA_DIR: /var/lib/iacp-controlplane
  IACP_DEFAULT_ENVIRONMENT: ${IACP_DEFAULT_ENVIRONMENT:-lab}
  IACP_ENABLED_ENVIRONMENTS: ${IACP_ENABLED_ENVIRONMENTS:-lab}
  IACP_RUNTIME_STAGE: ${IACP_RUNTIME_STAGE:-production}
  IACP_WASABI_ENABLED: ${IACP_WASABI_ENABLED:-false}
  IACP_PRX_ENABLED: ${IACP_PRX_ENABLED:-0}
  IACP_TFSTATE_BUCKET: ${IACP_TFSTATE_BUCKET:-}
  IACP_TFSTATE_ENDPOINT: ${IACP_TFSTATE_ENDPOINT:-}
  IACP_TFSTATE_REGION: ${IACP_TFSTATE_REGION:-}
  IACP_TFSTATE_PREFIX: ${IACP_TFSTATE_PREFIX:-}
  IACP_PROXMOX_MNG_ENDPOINT: ${IACP_PROXMOX_MNG_ENDPOINT:?Definir endpoint MNG}
  IACP_PROXMOX_MNG_API_TOKEN: ${IACP_PROXMOX_MNG_API_TOKEN:?Definir token MNG}
  IACP_PROXMOX_MNG_POOL_ID: ${IACP_PROXMOX_MNG_POOL_ID:-iacp-lab}
  IACP_PROXMOX_PRX_ENDPOINT: ${IACP_PROXMOX_PRX_ENDPOINT:-}
  IACP_PROXMOX_PRX_API_TOKEN: ${IACP_PROXMOX_PRX_API_TOKEN:-}
  IACP_PROXMOX_PRX_POOL_ID: ${IACP_PROXMOX_PRX_POOL_ID:-}
  IACP_PROXMOX_PRX_CREDENTIALS_FILE: ${IACP_PROXMOX_PRX_CREDENTIALS_FILE:-}
  IACP_PRX_CATALOG: ${IACP_PRX_CATALOG:-/app/terraform/environments/prx/catalog.json}
  IACP_TERRAFORM_PRX_DIR: ${IACP_TERRAFORM_PRX_DIR:-environments/prx}
  IACP_VMID_MIN: ${IACP_VMID_MIN:?Definir el VMID mínimo del entorno}
  IACP_VMID_MAX: ${IACP_VMID_MAX:?Definir el VMID máximo del entorno}
  IACP_VMID_REUSE: ${IACP_VMID_REUSE:-1}
  IACP_MAX_CONCURRENT: ${IACP_MAX_CONCURRENT:-1}
  IACP_TERRAFORM_TIMEOUT: ${IACP_TERRAFORM_TIMEOUT:-1800}
  IACP_POWER_TIMEOUT: ${IACP_POWER_TIMEOUT:-180}
  IACP_PROXMOX_RETRY_ATTEMPTS: ${IACP_PROXMOX_RETRY_ATTEMPTS:-6}
  IACP_PROXMOX_RETRY_BACKOFF: ${IACP_PROXMOX_RETRY_BACKOFF:-0.5}
  IACP_POWER_RECOVERY_TIMEOUT: ${IACP_POWER_RECOVERY_TIMEOUT:-300}
  IACP_RECONCILE_ATTEMPTS: ${IACP_RECONCILE_ATTEMPTS:-6}
  IACP_RECONCILE_TIMEOUT: ${IACP_RECONCILE_TIMEOUT:-180}
  IACP_TERRAFORM_RETRY_ATTEMPTS: ${IACP_TERRAFORM_RETRY_ATTEMPTS:-4}
  IACP_OPERATION_STALE_SECONDS: ${IACP_OPERATION_STALE_SECONDS:-900}
  IACP_RECOVERY_SCAN_SECONDS: ${IACP_RECOVERY_SCAN_SECONDS:-15}
  IACP_WORKER_POLL_SECONDS: ${IACP_WORKER_POLL_SECONDS:-0.5}
  IACP_WORKER_IDLE_HEARTBEAT_SECONDS: ${IACP_WORKER_IDLE_HEARTBEAT_SECONDS:-15}
  IACP_OPERATION_OUTPUT_MAX_CHARS: ${IACP_OPERATION_OUTPUT_MAX_CHARS:-65536}
  IACP_DEFAULT_SSH_PUBLIC_KEY: ${IACP_DEFAULT_SSH_PUBLIC_KEY:-}

x-worker-environment: &worker-environment
  <<: *runtime-environment
  IACP_WASABI_ACCESS_KEY_ID: ${IACP_WASABI_ACCESS_KEY_ID:-}
  IACP_WASABI_SECRET_ACCESS_KEY: ${IACP_WASABI_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iacp_controlplane}
      POSTGRES_USER: ${POSTGRES_USER:-iacp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en Portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ${IACP_IMAGE_REPOSITORY:?Definir IACP_IMAGE_REPOSITORY}:${IACP_IMAGE_TAG:?Definir IACP_IMAGE_TAG}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *runtime-environment
      IACP_API_TOKEN: ${IACP_API_TOKEN:?Definir IACP_API_TOKEN}
      IACP_BUILD_REVISION: ${IACP_IMAGE_TAG:?Definir IACP_IMAGE_TAG}
      IACP_REQUIRE_API_TOKEN: "1"
      IACP_ROOT_PASSWORD_MIN_LENGTH: ${IACP_ROOT_PASSWORD_MIN_LENGTH:-12}
      IACP_RETENTION_DAYS: ${IACP_RETENTION_DAYS:-0}
      IACP_MAX_QUEUE_DEPTH: ${IACP_MAX_QUEUE_DEPTH:-100}
      IACP_WORKER_STALE_SECONDS: ${IACP_OPERATION_STALE_SECONDS:-900}
    extra_hosts:
      - "${IACP_PROXMOX_MNG_HOSTNAME:-mng01.cyberfuel.com}:${IACP_PROXMOX_MNG_HOST_IP:?Definir IP verificada de MNG}"
    expose:
      - "8080"
    volumes:
      - workdata:/var/lib/iacp-controlplane
    networks:
      internal: {}
      proxy:
        aliases:
          - ${IACP_PROXY_SERVICE_ALIAS:-iacp-controlplane-api-prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  worker-1:
    image: ${IACP_IMAGE_REPOSITORY:?Definir IACP_IMAGE_REPOSITORY}:${IACP_IMAGE_TAG:?Definir IACP_IMAGE_TAG}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "worker.main", "--worker-id", "worker-1"]
    environment: *worker-environment
    extra_hosts:
      - "${IACP_PROXMOX_MNG_HOSTNAME:-mng01.cyberfuel.com}:${IACP_PROXMOX_MNG_HOST_IP:?Definir IP verificada de MNG}"
    volumes:
      - workdata:/var/lib/iacp-controlplane
    networks:
      - internal
      - egress
    depends_on:
      api:
        condition: service_healthy

  worker-2:
    image: ${IACP_IMAGE_REPOSITORY:?Definir IACP_IMAGE_REPOSITORY}:${IACP_IMAGE_TAG:?Definir IACP_IMAGE_TAG}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "worker.main", "--worker-id", "worker-2"]
    environment: *worker-environment
    extra_hosts:
      - "${IACP_PROXMOX_MNG_HOSTNAME:-mng01.cyberfuel.com}:${IACP_PROXMOX_MNG_HOST_IP:?Definir IP verificada de MNG}"
    volumes:
      - workdata:/var/lib/iacp-controlplane
    networks:
      - internal
      - egress
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
  proxy:
    external: true
    name: ${IACP_PROXY_NETWORK:-proxy_network}

volumes:
  postgres_data:
    name: ${IACP_POSTGRES_VOLUME:?Definir volumen PostgreSQL exclusivo de producción}
  workdata:
    name: ${IACP_WORKDATA_VOLUME:?Definir volumen de trabajo exclusivo de producción}
