# Plantilla de revisión, no aplicada. Aditiva sobre servicios y secretos existentes.
# No contiene claves; los archivos los suministra el mecanismo operativo autorizado.
secrets:
  bootstrap_aes_key:
    file: ${IACP_BOOTSTRAP_AES_KEY_PATH:?Referencia operativa requerida}
  guest_bootstrap_ssh_key:
    file: ${IACP_GUEST_BOOTSTRAP_SSH_KEY_PATH:?Identidad SSH ya autorizada requerida}
services:
  lifecycle-worker:
    environment:
      IACP_TERRAFORM_PROFILES_FILE: /run/config/profiles.json
    volumes:
      - type: bind
        source: ${IACP_TF_PROFILES_PATH:?Perfil operativo vigente requerido}
        target: /run/config/profiles.json
        read_only: true
  api:
    environment:
      IACP_CREATION_CONTRACT: ${IACP_CREATION_CONTRACT:-historical}
      IACP_BOOTSTRAP_AES_KEY_FILE: /run/secrets/bootstrap_aes_key
      IACP_BOOTSTRAP_SECRET_TTL_SECONDS: ${IACP_BOOTSTRAP_SECRET_TTL_SECONDS:-900}
    secrets:
      - source: bootstrap_aes_key
        target: /run/secrets/bootstrap_aes_key
  terraform-worker:
    environment:
      IACP_BOOTSTRAP_AES_KEY_FILE: /run/secrets/bootstrap_aes_key
      IACP_BOOTSTRAP_SECRET_TTL_SECONDS: ${IACP_BOOTSTRAP_SECRET_TTL_SECONDS:-900}
      IACP_GUEST_BOOTSTRAP_SSH_KEY_FILE: /run/secrets/guest_bootstrap_ssh_key
    secrets:
      - source: bootstrap_aes_key
        target: /run/secrets/bootstrap_aes_key
      - source: guest_bootstrap_ssh_key
        target: /run/secrets/guest_bootstrap_ssh_key
