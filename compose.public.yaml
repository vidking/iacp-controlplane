# Shared proxy override for public and corporate-internal manifests.
# compose.tls.yaml publishes 443 on IACP_TLS_BIND_IP; this adds HTTP redirect.
# Reuses the single existing Traefik service; the name is retained for compatibility.
# No Docker provider/socket. All exposure is explicit in the file provider.
services:
  traefik:
    image: ${IACP_TRAEFIK_IMAGE:?Imagen Traefik aprobada y fijada por digest}
    command: ["--configFile=/etc/traefik/public.yml"]
    volumes:
      - ./traefik/public.yml:/etc/traefik/public.yml:ro
    ports:
      - "${IACP_TLS_BIND_IP:?IP LAN autorizada}:80:80"
