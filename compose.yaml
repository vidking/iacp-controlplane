services:
  api:
    build: .
    image: ${IACP_API_IMAGE:-iacp-controlplanev2:local}
    command: uvicorn api.main:app --host 0.0.0.0 --port 8080
    environment:
      IACP_DB_PATH: /var/lib/iacp-v2/iacp.sqlite
      IACP_TERRAFORM_PATH: /workspace/terraform
      IACP_TERRAFORM_DIR: environments/mng01
      IACP_LOCAL_TERRAFORM_DIR: fixtures/local
      IACP_MNG_CATALOG: /workspace/terraform/environments/mng01/catalog.json
      IACP_API_TOKEN: ${IACP_API_TOKEN:-}
    ports:
      - "${IACP_API_PORT:-8080}:8080"
    volumes:
      - iacp_data:/var/lib/iacp-v2
      - ./terraform:/workspace/terraform:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-1:
    build: .
    image: ${IACP_WORKER_IMAGE:-iacp-controlplanev2:local}
    command: python -m worker.main --worker-id worker-1
    # Compose monta el secreto con los permisos del archivo de origen; el worker
    # necesita leerlo para que Terraform autentique contra Proxmox.
    user: "0:0"
    environment:
      IACP_DB_PATH: /var/lib/iacp-v2/iacp.sqlite
      IACP_TERRAFORM_PATH: /workspace/terraform
      IACP_TERRAFORM_DIR: environments/mng01
      IACP_LOCAL_TERRAFORM_DIR: fixtures/local
      IACP_MNG_CATALOG: /workspace/terraform/environments/mng01/catalog.json
      IACP_VMID_MIN: ${IACP_VMID_MIN:-40000}
      IACP_VMID_MAX: ${IACP_VMID_MAX:-49999}
      IACP_MAX_CONCURRENT: ${IACP_MAX_CONCURRENT:-2}
      IACP_DEFAULT_SSH_PUBLIC_KEY: ${IACP_DEFAULT_SSH_PUBLIC_KEY:-}
      IACP_PROXMOX_CREDENTIALS_FILE: /run/secrets/proxmox_credentials
    volumes:
      - iacp_data:/var/lib/iacp-v2
      - ./terraform:/workspace/terraform:ro
    secrets:
      - proxmox_credentials
    depends_on:
      api:
        condition: service_healthy

  worker-2:
    build: .
    image: ${IACP_WORKER_IMAGE:-iacp-controlplanev2:local}
    command: python -m worker.main --worker-id worker-2
    user: "0:0"
    environment:
      IACP_DB_PATH: /var/lib/iacp-v2/iacp.sqlite
      IACP_TERRAFORM_PATH: /workspace/terraform
      IACP_TERRAFORM_DIR: environments/mng01
      IACP_LOCAL_TERRAFORM_DIR: fixtures/local
      IACP_MNG_CATALOG: /workspace/terraform/environments/mng01/catalog.json
      IACP_VMID_MIN: ${IACP_VMID_MIN:-40000}
      IACP_VMID_MAX: ${IACP_VMID_MAX:-49999}
      IACP_MAX_CONCURRENT: ${IACP_MAX_CONCURRENT:-2}
      IACP_DEFAULT_SSH_PUBLIC_KEY: ${IACP_DEFAULT_SSH_PUBLIC_KEY:-}
      IACP_PROXMOX_CREDENTIALS_FILE: /run/secrets/proxmox_credentials
    volumes:
      - iacp_data:/var/lib/iacp-v2
      - ./terraform:/workspace/terraform:ro
    secrets:
      - proxmox_credentials
    depends_on:
      api:
        condition: service_healthy

volumes:
  iacp_data:

secrets:
  proxmox_credentials:
    file: ${IACP_PROXMOX_CREDENTIALS_FILE:-./secrets/proxmox_credentials.example.json}

