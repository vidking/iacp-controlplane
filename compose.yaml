name: iacp-controlplane-dev

x-app-environment: &app-environment
  PGHOST: postgres
  PGPORT: 5432
  PGDATABASE: ${POSTGRES_DB:-iacp_controlplane}
  PGUSER: ${POSTGRES_USER:-iacp}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
  IACP_TERRAFORM_PATH: /app/terraform
  IACP_TERRAFORM_MNG_DIR: environments/mng01
  IACP_MNG_CATALOG: /app/terraform/environments/mng01/catalog.json
  IACP_DEFAULT_ENVIRONMENT: ${IACP_DEFAULT_ENVIRONMENT:-lab}
  IACP_ENABLED_ENVIRONMENTS: ${IACP_ENABLED_ENVIRONMENTS:-lab}
  IACP_RUNTIME_STAGE: ${IACP_RUNTIME_STAGE:-develop}
  IACP_WASABI_ENABLED: ${IACP_WASABI_ENABLED:-false}
  IACP_PROXMOX_MNG_ENDPOINT: ${IACP_PROXMOX_MNG_ENDPOINT:?Definir el endpoint MNG}
  IACP_PROXMOX_MNG_API_TOKEN: ${IACP_PROXMOX_MNG_API_TOKEN:?Definir el token MNG}
  IACP_PROXMOX_MNG_POOL_ID: ${IACP_PROXMOX_MNG_POOL_ID:-iacp-lab}
  IACP_PROXMOX_ENDPOINT: ${IACP_PROXMOX_MNG_ENDPOINT:?Definir el endpoint MNG}
  IACP_PROXMOX_API_TOKEN: ${IACP_PROXMOX_MNG_API_TOKEN:?Definir el token MNG}
  IACP_PROXMOX_POOL_ID: ${IACP_PROXMOX_MNG_POOL_ID:-iacp-lab}
  IACP_VMID_MIN: ${IACP_VMID_MIN:-40000}
  IACP_VMID_MAX: ${IACP_VMID_MAX:-49999}
  IACP_VMID_REUSE: ${IACP_VMID_REUSE:-1}
  IACP_ADDITIONAL_PROTECTED_VMIDS: ${IACP_ADDITIONAL_PROTECTED_VMIDS:-}
  IACP_ENFORCE_WAN_ONLY: ${IACP_ENFORCE_WAN_ONLY:-0}
  IACP_MAX_CONCURRENT: ${IACP_MAX_CONCURRENT:-6}
  IACP_TERRAFORM_TIMEOUT: ${IACP_TERRAFORM_TIMEOUT:-1800}
  IACP_POWER_TIMEOUT: ${IACP_POWER_TIMEOUT:-180}
  IACP_PROXMOX_RETRY_ATTEMPTS: ${IACP_PROXMOX_RETRY_ATTEMPTS:-6}
  IACP_PROXMOX_RETRY_BACKOFF: ${IACP_PROXMOX_RETRY_BACKOFF:-0.5}
  IACP_POWER_RECOVERY_TIMEOUT: ${IACP_POWER_RECOVERY_TIMEOUT:-300}
  IACP_RECONCILE_ATTEMPTS: ${IACP_RECONCILE_ATTEMPTS:-6}
  IACP_RECONCILE_TIMEOUT: ${IACP_RECONCILE_TIMEOUT:-180}
  IACP_TERRAFORM_RETRY_ATTEMPTS: ${IACP_TERRAFORM_RETRY_ATTEMPTS:-4}
  IACP_OPERATION_STALE_SECONDS: ${IACP_OPERATION_STALE_SECONDS:-900}
  IACP_RECOVERY_SCAN_SECONDS: ${IACP_RECOVERY_SCAN_SECONDS:-15}
  IACP_WORKER_POLL_SECONDS: ${IACP_WORKER_POLL_SECONDS:-0.5}
  IACP_WORKER_IDLE_HEARTBEAT_SECONDS: ${IACP_WORKER_IDLE_HEARTBEAT_SECONDS:-15}
  IACP_OPERATION_OUTPUT_MAX_CHARS: ${IACP_OPERATION_OUTPUT_MAX_CHARS:-65536}
  IACP_DEFAULT_SSH_PUBLIC_KEY: ${IACP_DEFAULT_SSH_PUBLIC_KEY:-}
  IACP_SERVICE_KEY_FILE: /run/iacp-services/key

  IACP_PROD_STATIC_ENABLED: ${IACP_PROD_STATIC_ENABLED:-0}
  IACP_PROD_STATIC_BRIDGE: ${IACP_PROD_STATIC_BRIDGE:-vmbr0}
  IACP_NETBOX_URL: ${IACP_NETBOX_URL:-}
  IACP_NETBOX_TOKEN: ${IACP_NETBOX_TOKEN:-}
  IACP_NETBOX_VERIFY_TLS: ${IACP_NETBOX_VERIFY_TLS:-1}

services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iacp_controlplane}
      POSTGRES_USER: ${POSTGRES_USER:-iacp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    image: ${IACP_API_IMAGE:-iacp-controlplane:local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *app-environment
      IACP_WORKDATA_DIR: /var/lib/iacp-controlplane
      IACP_API_TOKEN: ${IACP_API_TOKEN:-}
      IACP_ALLOW_INSECURE_LOCAL_DEV: ${IACP_ALLOW_INSECURE_LOCAL_DEV:-0}
      IACP_ROOT_PASSWORD_MIN_LENGTH: ${IACP_ROOT_PASSWORD_MIN_LENGTH:-12}
      IACP_RETENTION_DAYS: ${IACP_RETENTION_DAYS:-0}
      IACP_SERVICES_ENABLED: ${IACP_SERVICES_ENABLED:-0}
      IACP_SERVICE_MAX_CONCURRENT: ${IACP_SERVICE_MAX_CONCURRENT:-6}
      IACP_SERVICE_KEY_FILE: /run/iacp-service-key
      IACP_SERVICE_CA_CERT_FILE: /run/iacp-pilot-ca.crt
      IACP_MAX_QUEUE_DEPTH: ${IACP_MAX_QUEUE_DEPTH:-100}
      IACP_WORKER_STALE_SECONDS: ${IACP_OPERATION_STALE_SECONDS:-900}
    extra_hosts:
      - "${IACP_PROXMOX_MNG_HOSTNAME:-mng01.cyberfuel.com}:${IACP_PROXMOX_MNG_HOST_IP:?Definir IP verificada de MNG}"
    ports:
      - "127.0.0.1:${IACP_API_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${IACP_SERVICE_CONFIG_DIR:-./secrets/services}/key
        target: /run/iacp-service-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${IACP_SERVICE_CONFIG_DIR:-./secrets/services}/pilot-ca.crt
        target: /run/iacp-pilot-ca.crt
        read_only: true
        bind:
          create_host_path: false
      - workdata:/var/lib/iacp-controlplane
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  worker-1:
    build: .
    image: ${IACP_API_IMAGE:-iacp-controlplane:local}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python", "-m", "worker.main", "--worker-id", "worker-1"]
    environment:
      <<: *app-environment
      IACP_WORKDATA_DIR: /var/lib/iacp-controlplane
    extra_hosts:
      - "${IACP_PROXMOX_MNG_HOSTNAME:-mng01.cyberfuel.com}:${IACP_PROXMOX_MNG_HOST_IP:?Definir IP verificada de MNG}"
    volumes:
      - workdata:/var/lib/iacp-controlplane
      - type: bind
        source: ${IACP_SERVICE_CONFIG_DIR:-./secrets/services}/key
        target: /run/iacp-services/key
        read_only: true
    depends_on:
      api:
        condition: service_healthy

  worker-2:
    build: .
    image: ${IACP_API_IMAGE:-iacp-controlplane:local}
